name: RP2040 native hwmon firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "main.c"
      - "usb_descriptors.c"
      - "tusb_config.h"
      - "tests/**"
      - ".github/workflows/rp2040-native-hwmon.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build RP2040 UF2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify report layout
        run: python3 -m unittest discover -s tests -v

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Download Raspberry Pi Pico SDK (2.1.1)
        run: |
          git clone --depth 1 --branch 2.1.1 --recurse-submodules \
            https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: cmake -S . -B build -G Ninja -DPICO_BOARD=pico -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Upload flashable UF2
        uses: actions/upload-artifact@v4
        with:
          name: rp2040-native-hwmon-uf2
          path: build/rp2040_native_hwmon.uf2
          if-no-files-found: error
